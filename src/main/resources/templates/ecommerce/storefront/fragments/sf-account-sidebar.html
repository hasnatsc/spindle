<!DOCTYPE html>
<!-- ecommerce/storefront/fragments/sf-account-sidebar.html
     v2: Addresses + Wishlist links; fixed the invalid <a>-inside-<button> logout markup. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar(active)" class="sf-portal-side">
  <nav class="sf-portal-nav">
    <a href="/account/dashboard" th:classappend="${active == 'dashboard'} ? 'active'"><i class="fa-solid fa-house"></i> Dashboard</a>
    <a href="/account/orders" th:classappend="${active == 'orders'} ? 'active'"><i class="fa-solid fa-box"></i> Order History</a>
    <a href="/account/wishlist" th:classappend="${active == 'wishlist'} ? 'active'"><i class="fa-regular fa-heart"></i> Wishlist</a>
    <a href="/account/addresses" th:classappend="${active == 'addresses'} ? 'active'"><i class="fa-solid fa-location-dot"></i> Addresses</a>
    <a href="/account/profile" th:classappend="${active == 'profile'} ? 'active'"><i class="fa-regular fa-user"></i> Profile</a>
    <a href="/cart"><i class="fa-solid fa-bag-shopping"></i> Cart</a>
    <form action="/account/logout" method="post" style="margin:0">
      <button type="submit" class="sf-portal-logout danger">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
      </button>
    </form>
  </nav>
</div>
</body>
</html>
