<!DOCTYPE html>
<!-- ecommerce/storefront/sf-account-profile.html  GET /account/profile -->
<html th:replace="~{ecommerce/storefront/layout/sf-base :: layout('Profile', ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<main>
  <div id="my-account" class="section-container pt-20px">
    <div class="container">
      <ul class="breadcrumb mb-2">
        <li class="breadcrumb-item"><a href="/account/dashboard">My Account</a></li>
        <li class="breadcrumb-item active">Profile</li>
      </ul>
      <div th:replace="~{ecommerce/storefront/fragments/sf-account-shell :: shell('profile', ~{::#sfBody})}"></div>
      
    </div>
  </div>

  <script th:inline="none">
    function sfSaveProfile() {
      var btn = document.getElementById('sfPfSaveBtn');
      btn.disabled = true;
      sfFetch('/account/profile', {
        method: 'POST',
        body: JSON.stringify({
          firstName: document.getElementById('sfPfFirst').value.trim(),
          lastName: document.getElementById('sfPfLast').value.trim(),
          email: document.getElementById('sfPfEmail').value.trim()
        })
      }).then(function (d) {
        btn.disabled = false;
        sfToast(d.message || (d.success ? 'Profile updated.' : 'Could not update.'), !d.success);
      }).catch(function () { btn.disabled = false; sfToast('Could not update.', true); });
    }
  </script>
</main>

<!-- account body — selected by ::#sfBody, rendered only inside the shell -->
<th:block id="sfBody">
        <h4><i class="fa fa-user fa-fw text-theme"></i> Profile</h4>
        <div class="row">
          <div class="col-md-8">
            <div class="mb-3 row">
              <label class="col-form-label col-md-3">First Name <span class="text-danger">*</span></label>
              <div class="col-md-9"><input type="text" class="form-control" id="sfPfFirst" th:value="${customer.firstName}" /></div>
            </div>
            <div class="mb-3 row">
              <label class="col-form-label col-md-3">Last Name</label>
              <div class="col-md-9"><input type="text" class="form-control" id="sfPfLast" th:value="${customer.lastName}" /></div>
            </div>
            <div class="mb-3 row">
              <label class="col-form-label col-md-3">Email</label>
              <div class="col-md-9"><input type="email" class="form-control" id="sfPfEmail" th:value="${customer.email}" /></div>
            </div>
            <div class="mb-3 row">
              <label class="col-form-label col-md-3">Phone</label>
              <div class="col-md-9"><input type="text" class="form-control" th:value="${customer.phone}" disabled /></div>
            </div>
            <div class="row">
              <div class="col-md-9 offset-md-3">
                <button type="button" class="btn btn-dark btn-theme" id="sfPfSaveBtn" onclick="sfSaveProfile()">SAVE CHANGES</button>
              </div>
            </div>
          </div>
        </div>
      </th:block>

</html>
