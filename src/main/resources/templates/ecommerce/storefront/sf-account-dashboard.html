<!DOCTYPE html>
<!-- ecommerce/storefront/sf-account-dashboard.html  GET /account/dashboard -->
<html th:replace="~{ecommerce/storefront/layout/sf-base :: layout('My Account', ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<main>
  <div id="my-account" class="section-container pt-20px">
    <div class="container">
      <ul class="breadcrumb mb-2">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item active">My Account</li>
      </ul>
      <div th:replace="~{ecommerce/storefront/fragments/sf-account-shell :: shell('dashboard', ~{::#sfBody})}"></div>
      
    </div>
  </div>
</main>

<!-- account body — selected by ::#sfBody, rendered only inside the shell -->
<th:block id="sfBody">
        <div class="row mb-4">
          <div class="col-md-4 mb-3 mb-md-0">
            <div class="sf-stat-card">
              <div class="num" th:text="${totalOrders ?: 0}">12</div>
              <div class="lbl">Total Orders</div>
            </div>
          </div>
          <div class="col-md-4 mb-3 mb-md-0">
            <div class="sf-stat-card">
              <div class="num" th:text="'৳' + ${#numbers.formatDecimal(totalPurchase ?: 0, 0, 'COMMA', 0, 'POINT')}">৳45,000</div>
              <div class="lbl">Total Purchase</div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="sf-stat-card">
              <div class="num" th:text="${rewardPoints ?: 0}">120</div>
              <div class="lbl">Reward Points</div>
            </div>
          </div>
        </div>

        <h4><i class="fa fa-box fa-fw text-theme"></i> Recent Orders</h4>
        <div class="table-responsive" th:if="${recentOrders != null and !recentOrders.isEmpty()}">
          <table class="table align-middle">
            <thead><tr><th>Order No</th><th>Date</th><th>Status</th><th class="text-end">Total</th><th></th></tr></thead>
            <tbody>
              <tr th:each="o : ${recentOrders}">
                <td th:text="${o.orderNo}">EC-ORDER-26-000001</td>
                <td th:text="${#temporals.format(o.orderDate, 'dd MMM yyyy')}">05 Jul 2026</td>
                <td><span class="badge bg-secondary" th:text="${o.orderStatus}">PENDING</span></td>
                <td class="text-end" th:text="'৳' + ${#numbers.formatDecimal(o.grandTotal, 0, 'COMMA', 0, 'POINT')}">৳999</td>
                <td class="text-end"><a th:href="@{'/account/orders/' + ${o.orderNo}}" class="btn btn-sm btn-white">View</a></td>
              </tr>
            </tbody>
          </table>
        </div>
        <p class="text-muted" th:if="${recentOrders == null or recentOrders.isEmpty()}">No orders yet — <a href="/shop">start shopping</a>.</p>
      </th:block>

</html>
