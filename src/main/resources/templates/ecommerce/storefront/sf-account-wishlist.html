<!DOCTYPE html>
<!-- ecommerce/storefront/sf-account-wishlist.html  GET /account/wishlist -->
<html th:replace="~{ecommerce/storefront/layout/sf-base :: layout('My Wishlist', ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<main>
  <div id="my-account" class="section-container pt-20px">
    <div class="container">
      <ul class="breadcrumb mb-2">
        <li class="breadcrumb-item"><a href="/account/dashboard">My Account</a></li>
        <li class="breadcrumb-item active">Wishlist</li>
      </ul>
      <div th:replace="~{ecommerce/storefront/fragments/sf-account-shell :: shell('wishlist', ~{::#sfBody})}"></div>
      
    </div>
  </div>
</main>

<!-- account body — selected by ::#sfBody, rendered only inside the shell -->
<th:block id="sfBody">
        <h4><i class="fa fa-heart fa-fw text-theme"></i> Wishlist</h4>

        <div th:if="${items == null or items.isEmpty()}" class="text-center text-muted py-5">
          <i class="far fa-heart fa-2x mb-3 d-block"></i>
          Nothing saved yet. Tap the heart on any product to keep it here.
          <div class="mt-3"><a href="/shop" class="btn btn-dark btn-theme">BROWSE THE COLLECTION</a></div>
        </div>

        <div class="row gx-2" id="sfWishlistGrid" th:unless="${items == null or items.isEmpty()}">
          <th:block th:each="p : ${items}">
            <div class="col-lg-3 col-md-4 col-sm-6 sf-wish-col">
              <div th:replace="~{ecommerce/storefront/fragments/sf-product-card :: card(${p})}"></div>
            </div>
          </th:block>
        </div>
      </th:block>

</html>
