<!DOCTYPE html>
<!-- ecommerce/storefront/sf-order-success.html  GET /checkout/success/{orderNo}  (NEW in v2) -->
<html th:replace="~{ecommerce/storefront/layout/sf-base :: layout('Order Placed', ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<main>
  <section class="sf-cart-page">
    <div class="container">
      <div class="sf-success">
        <div class="sf-success-icon"><i class="fa-solid fa-check"></i></div>
        <h1>Order placed. Nice pick.</h1>
        <p class="sf-success-sub">
          Your order number is <span class="sf-mono" th:text="${order.orderNo}">EC-ORDER-26-000001</span>.
          We'll confirm it shortly and get it moving from the mill floor to your door.
        </p>
        <div class="sf-success-total">
          <span>Amount to pay on delivery</span>
          <strong th:text="'৳' + ${#numbers.formatDecimal(order.grandTotal, 0, 'COMMA', 0, 'POINT')}">৳1,880</strong>
        </div>
        <p class="sf-success-note"><i class="fa-solid fa-hand-holding-dollar"></i> Cash on Delivery — please keep the amount ready when the rider arrives.</p>
        <div class="sf-success-actions">
          <a th:href="@{'/account/orders/' + ${order.orderNo}}" class="sf-btn sf-btn--primary">View Order</a>
          <a href="/shop" class="sf-btn sf-btn--outline">Continue Shopping</a>
        </div>
      </div>
    </div>
  </section>
</main>
</html>
