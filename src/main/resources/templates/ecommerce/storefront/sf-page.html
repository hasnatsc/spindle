<!DOCTYPE html>
<!-- ecommerce/storefront/sf-page.html  GET /page/{slug} — CMS page from ec_pages. -->
<html th:replace="~{ecommerce/storefront/layout/sf-base :: layout(${pageTitle}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<main>
  <div id="page-header" class="section-container page-header-container bg-dark">
    <div class="page-header-cover sf-header-cover"></div>
    <div class="container"><h1 class="page-header" th:text="${pageTitle}">Page Title</h1></div>
  </div>
  <div class="section-container pt-20px">
    <div class="container" style="max-width:860px">
      <div class="sf-cms-body" th:utext="${pageContent}">Content…</div>
    </div>
  </div>
</main>
</html>
