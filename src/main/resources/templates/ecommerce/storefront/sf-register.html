<!DOCTYPE html>
<!-- ecommerce/storefront/sf-register.html  GET /account/register -->
<html th:replace="~{ecommerce/storefront/layout/sf-base :: layout('Create Account', ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<main>
  <div class="section-container">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          <div class="sf-auth-card">
            <h3 class="mb-1">Create Account</h3>
            <p class="text-muted mb-4">One account for orders, wishlist, and faster checkout.</p>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label">First Name *</label>
                <input type="text" id="sfRegFirst" class="form-control" />
              </div>
              <div class="col-6">
                <label class="form-label">Last Name</label>
                <input type="text" id="sfRegLast" class="form-control" />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Phone *</label>
              <input type="tel" id="sfRegPhone" class="form-control" placeholder="01712345678" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="sfRegEmail" class="form-control" placeholder="optional" />
            </div>
            <div class="mb-3">
              <label class="form-label">Password *</label>
              <input type="password" id="sfRegPass" class="form-control" placeholder="At least 6 characters" />
            </div>
            <div id="sfRegError" class="alert alert-danger" style="display:none"></div>
            <button type="button" class="btn btn-dark btn-theme btn-lg w-100" id="sfRegBtn" onclick="sfDoRegister()">CREATE ACCOUNT</button>
            <p class="text-center mt-3 mb-0">
              Already have an account? <a th:href="@{/account/login(redirect=${redirectUrl})}" class="fw-bold text-dark">Sign in</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:inline="javascript">
    var sfRedirectUrl = /*[[${redirectUrl}]]*/ '/account/dashboard';
    function sfDoRegister() {
      var err = document.getElementById('sfRegError');
      err.style.display = 'none';
      var payload = {
        firstName: document.getElementById('sfRegFirst').value.trim(),
        lastName: document.getElementById('sfRegLast').value.trim(),
        phone: document.getElementById('sfRegPhone').value.trim(),
        email: document.getElementById('sfRegEmail').value.trim(),
        password: document.getElementById('sfRegPass').value
      };
      if (!payload.firstName || !payload.phone || !payload.password) {
        err.textContent = 'Please fill in your name, phone, and password.'; err.style.display = ''; return;
      }
      var btn = document.getElementById('sfRegBtn');
      btn.disabled = true;
      sfFetch('/account/register', { method: 'POST', body: JSON.stringify(payload) })
        .then(function (d) {
          if (d.success) {
            window.location.href = (sfRedirectUrl && sfRedirectUrl.charAt(0) === '/') ? sfRedirectUrl : '/account/dashboard';
          } else {
            btn.disabled = false;
            err.textContent = d.message || 'Registration failed.';
            err.style.display = '';
          }
        }).catch(function () { btn.disabled = false; err.textContent = 'Something went wrong.'; err.style.display = ''; });
    }
  </script>
</main>
</html>
