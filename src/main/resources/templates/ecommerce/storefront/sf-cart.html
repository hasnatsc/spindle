<!DOCTYPE html>
<!-- ecommerce/storefront/sf-cart.html  GET /cart — theme checkout step 1:
     wizard header + table-cart with qty steppers + coupon + summary. -->
<html th:replace="~{ecommerce/storefront/layout/sf-base :: layout('Shopping Cart', ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<main>
  <div class="section-container" id="checkout-cart">
    <div class="container">
      <div class="checkout">
        <div th:replace="~{ecommerce/storefront/fragments/sf-checkout-steps :: steps(1)}"></div>

        <!-- empty -->
        <div class="checkout-body" th:if="${cart.items == null or cart.items.isEmpty()}">
          <div class="text-center py-5">
            <i class="fa fa-shopping-bag fa-3x text-muted mb-3 d-block"></i>
            <h4>Your cart is empty.</h4>
            <a href="/shop" class="btn btn-dark btn-theme mt-3">START SHOPPING</a>
          </div>
        </div>

        <th:block th:unless="${cart.items == null or cart.items.isEmpty()}">
          <div class="checkout-body">
            <div class="table-responsive">
              <table class="table table-cart">
                <thead>
                  <tr>
                    <th>Product Name</th>
                    <th class="text-center">Price</th>
                    <th class="text-center">Quantity</th>
                    <th class="text-center">Total</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="item : ${cart.items}" th:attr="data-item-id=${item.id}" class="sf-cart-line">
                    <td class="cart-product">
                      <div class="d-flex">
                        <div class="product-img h-100px w-80px d-flex align-items-center justify-content-center">
                          <img th:src="${item.productImage ?: 'https://placehold.co/160x200/f4f4f4/999999?text=ASG'}" class="mw-100 mh-100" alt="" />
                        </div>
                        <div class="product-info ms-3">
                          <div class="title"><a th:href="@{'/product/' + ${item.productSlug}}" th:text="${item.productTitle}" class="text-dark">Product</a></div>
                          <div class="desc" th:if="${item.variantName}" th:text="${item.variantName}">Variant</div>
                        </div>
                      </div>
                    </td>
                    <td class="cart-price text-center" th:text="'৳' + ${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')}">৳999</td>
                    <td class="cart-qty text-center">
                      <div class="cart-qty-input">
                        <a href="javascript:;" class="qty-control left sf-qty-minus"><i class="fa fa-minus"></i></a>
                        <input type="text" th:value="${item.quantity.intValue()}" class="form-control sf-cart-qty-input" />
                        <a href="javascript:;" class="qty-control right sf-qty-plus"><i class="fa fa-plus"></i></a>
                      </div>
                    </td>
                    <td class="cart-total text-center sf-line-total" th:text="'৳' + ${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 0, 'POINT')}">৳999</td>
                    <td class="text-center">
                      <a href="javascript:;" class="text-danger" onclick="sfRemoveCartItem(this)">&times;</a>
                    </td>
                  </tr>

                  <tr>
                    <td class="cart-summary" colspan="5">
                      <!-- coupon -->
                      <div class="sf-coupon-wrap mb-3">
                        <div th:if="${appliedCoupon == null}" class="input-group w-300px ms-auto">
                          <input type="text" id="sfCouponInput" class="form-control text-uppercase" placeholder="Coupon code" />
                          <button type="button" class="btn btn-dark" id="sfCouponBtn" onclick="sfApplyCoupon()">APPLY</button>
                        </div>
                        <div th:if="${appliedCoupon != null}" class="text-end">
                          <span class="badge bg-success fs-12px">
                            <i class="fa fa-tag me-1"></i>
                            <span th:text="${appliedCoupon['code']}">SAVE10</span> applied —
                            −৳<span th:text="${#numbers.formatDecimal(appliedCoupon['discount'], 0, 'COMMA', 0, 'POINT')}">100</span>
                          </span>
                          <a href="javascript:;" class="text-danger ms-2 fs-12px" onclick="sfRemoveCoupon()">Remove</a>
                        </div>
                      </div>

                      <div class="summary-container">
                        <div class="summary-row">
                          <div class="field">Cart Subtotal</div>
                          <div class="value" id="sfSumSubtotal" th:text="'৳' + ${#numbers.formatDecimal(cart.subtotal, 0, 'COMMA', 0, 'POINT')}">৳999</div>
                        </div>
                        <div class="summary-row text-success" id="sfSumCouponRow"
                             th:style="${cart.couponDiscount == null or cart.couponDiscount == 0} ? 'display:none' : ''">
                          <div class="field">Coupon Discount</div>
                          <div class="value" id="sfSumCoupon" th:text="'−৳' + ${#numbers.formatDecimal(cart.couponDiscount ?: 0, 0, 'COMMA', 0, 'POINT')}">−৳100</div>
                        </div>
                        <div class="summary-row text-danger">
                          <div class="field">Shipping</div>
                          <div class="value" id="sfSumShipping" th:text="${cart.shippingCharge != null and cart.shippingCharge == 0} ? 'Free' : ('৳' + ${#numbers.formatDecimal(cart.shippingCharge, 0, 'COMMA', 0, 'POINT')})">Free</div>
                        </div>
                        <div class="summary-row total">
                          <div class="field">Total</div>
                          <div class="value" id="sfSumTotal" th:text="'৳' + ${#numbers.formatDecimal(cart.grandTotal, 0, 'COMMA', 0, 'POINT')}">৳999</div>
                        </div>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="checkout-footer d-flex">
            <a href="/shop" class="btn btn-white btn-lg me-auto btn-theme w-250px">CONTINUE SHOPPING</a>
            <a href="/checkout/info" class="btn btn-dark btn-lg btn-theme w-250px">CHECKOUT</a>
          </div>
        </th:block>
      </div>
    </div>
  </div>

  <script th:inline="none">
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.sf-cart-line').forEach(function (row) {
        var input = row.querySelector('.sf-cart-qty-input');
        var send = function () {
          var qty = Math.max(1, parseInt(input.value || '1', 10));
          input.value = qty;
          sfFetch('/cart/update/' + row.dataset.itemId, { method: 'POST', body: JSON.stringify({ quantity: qty }) })
            .then(function (d) {
              if (!d.success) { sfToast(d.message, true); return; }
              var it = (d.cart.items || []).find(function (x) { return String(x.id) === String(row.dataset.itemId); });
              if (it) row.querySelector('.sf-line-total').textContent = '৳' + Math.round(it.lineTotal).toLocaleString();
              sfRefreshCartSummary(d.cart);
            });
        };
        input.addEventListener('change', send);
        row.querySelector('.sf-qty-minus').addEventListener('click', function () { input.value = Math.max(1, (parseInt(input.value,10)||1) - 1); send(); });
        row.querySelector('.sf-qty-plus').addEventListener('click', function () { input.value = (parseInt(input.value,10)||1) + 1; send(); });
      });
      var couponInput = document.getElementById('sfCouponInput');
      if (couponInput) couponInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); sfApplyCoupon(); }
      });
    });

    function sfRemoveCartItem(el) {
      var row = el.closest('.sf-cart-line');
      sfFetch('/cart/remove/' + row.dataset.itemId, { method: 'DELETE' }).then(function (d) {
        if (d.success) {
          row.remove();
          sfRefreshCartSummary(d.cart);
          sfToast('Removed from cart.');
          if (!d.cart.items || d.cart.items.length === 0) setTimeout(function () { location.reload(); }, 500);
        }
      });
    }
    function sfApplyCoupon() {
      var input = document.getElementById('sfCouponInput');
      var code = (input.value || '').trim();
      if (!code) { sfToast('Please enter a coupon code.', true); return; }
      var btn = document.getElementById('sfCouponBtn');
      btn.disabled = true;
      sfFetch('/cart/apply-coupon', { method: 'POST', body: JSON.stringify({ code: code }) })
        .then(function (d) {
          btn.disabled = false;
          if (d.success) { sfToast(d.message); setTimeout(function () { location.reload(); }, 500); }
          else { sfToast(d.message || 'Could not apply coupon.', true); }
        }).catch(function () { btn.disabled = false; });
    }
    function sfRemoveCoupon() {
      sfFetch('/cart/remove-coupon', { method: 'POST' }).then(function (d) {
        if (d.success) { sfToast(d.message); setTimeout(function () { location.reload(); }, 400); }
      });
    }
    function sfRefreshCartSummary(cart) {
      document.getElementById('sfSumSubtotal').textContent = '৳' + Math.round(cart.subtotal).toLocaleString();
      var row = document.getElementById('sfSumCouponRow');
      if (row) {
        if (cart.couponDiscount && cart.couponDiscount > 0) {
          row.style.display = '';
          document.getElementById('sfSumCoupon').textContent = '−৳' + Math.round(cart.couponDiscount).toLocaleString();
        } else row.style.display = 'none';
      }
      document.getElementById('sfSumShipping').textContent = cart.shippingCharge == 0 ? 'Free' : '৳' + Math.round(cart.shippingCharge).toLocaleString();
      document.getElementById('sfSumTotal').textContent = '৳' + Math.round(cart.grandTotal).toLocaleString();
      sfUpdateCartBadge(cart.totalItems || 0);
    }
  </script>
</main>
</html>
