<!DOCTYPE html>
<!-- travel-site/tf-enquiry-success.html  GET /travel-site/enquiry/success/{bookingNo} -->
<html th:replace="~{travel-site/layout/tf-base :: layout('Enquiry Received', ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<main>
  <section class="tf-section">
    <div class="container">
      <div class="tf-success">
        <div class="tf-success-icon"><i class="fa-solid fa-paper-plane"></i></div>
        <h1>Got it — we're on it.</h1>
        <p class="tf-success-sub">
          Your enquiry reference is <span class="tf-mono" th:text="${bookingNo}">TRV-000001</span>.
          One of our travel agents will call or WhatsApp you shortly to confirm details and pricing.
        </p>
        <div class="tf-success-actions">
          <a href="/travel-site/packages" class="tf-btn tf-btn--primary">Browse More Packages</a>
          <a href="/travel-site" class="tf-btn tf-btn--outline">Back to Home</a>
        </div>
      </div>
    </div>
  </section>
</main>
</html>
