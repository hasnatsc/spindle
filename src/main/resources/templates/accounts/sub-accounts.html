<!DOCTYPE html>
<!--
  accounts/sub-accounts.html

  ONE page for all eleven sub-ledger partitions.

  There is deliberately no type-specific markup below. The page asks
  /accounts/sub-accounts/meta?type=X for a schema and builds the grid columns,
  the form, the save payload and the view panel from it. Adding a field to
  SubAccountField makes it appear here on the next load — no template edit, no
  JavaScript edit.

  Replaces: sub-accounts.html + bank-accounts.html + cash-accounts.html +
            customer-accounts.html + supplier-accounts.html + employee-accounts.html

  Pickers:
    Main Account  → /accounts/chart-of-accounts/search
    Bank          → /accounts/sub-accounts/banks
    Sub-account   → /accounts/sub-accounts/search?subAccountType=…
-->
<html th:replace="~{layout/base :: layout('Sub-Ledger Accounts', ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<section>

  <!-- The controller's type reaches the script through this attribute rather than
       th:inline, so the script block stays plain JavaScript. -->
  <div id="subPageConfig" th:attr="data-type=${subAccountType}" class="d-none"></div>

  <ol class="breadcrumb float-xl-end">
    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
    <li class="breadcrumb-item">Accounts</li>
    <li class="breadcrumb-item active">Sub-Ledger Accounts</li>
  </ol>
  <h1 class="page-header">
    Sub-Ledger Accounts
    <small id="subPageSubtitle">cash, bank, MFS, cards, wallets, parties &amp; LCs</small>
  </h1>

  <div id="successMessages"></div>

  <!-- Tab strip — rendered from /types, with live row counts -->
  <ul class="nav nav-tabs mb-3 bg-gray-700" id="subTypeTabs"></ul>

  <div class="panel panel-inverse">
    <div class="panel-heading">
      <div class="panel-title">
        <a href="javascript:;" onclick="subOpenCreate()">
          <span class="badge btn btn-outline-success"><i class="fa fa-plus me-1"></i> <span id="subCreateLabel">New Sub-Account</span></span>
        </a>
      </div>
      <div class="panel-heading-btn">
        <a href="javascript:;" class="btn btn-sm btn-icon btn-default" data-toggle="panel-expand"><i class="fa fa-expand"></i></a>
        <a href="javascript:;" class="btn btn-sm btn-icon btn-success" data-toggle="panel-reload"><i class="fa fa-redo"></i></a>
        <a href="javascript:;" class="btn btn-sm btn-icon btn-warning" data-toggle="panel-collapse"><i class="fa fa-minus"></i></a>
      </div>
    </div>
    <div class="panel-body">
      <table id="subTable" width="100%" class="table table-striped table-bordered align-middle">
        <thead><tr id="subTableHead"></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- CREATE / EDIT — body is generated from the schema -->
    <div tabindex="-1" id="subModal" class="modal fade">
      <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="subModalTitle"><i class="fa fa-plus me-1 text-success"></i> New Sub-Account</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <form id="subForm" novalidate>
            <div class="modal-body">
              <div class="hs-box">
                <input type="hidden" id="subId">

                <div class="row g-2 mb-3">
                  <div class="col-md-4 view-group">
                    <select id="subType" class="form-select hs_span_view" required></select>
                    <label for="subType" class="input-label">Sub-Account Type <span class="text-danger">*</span></label>
                    <small class="text-muted d-block" id="subTypeLockNote"></small>
                  </div>
                  <div class="col-md-8 d-flex align-items-center">
                    <div class="alert alert-secondary py-1 px-2 mb-0 w-100 small" id="subTypeHint"></div>
                  </div>
                </div>

                <div id="subFormBody"></div>

                <div class="mt-3">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="subActive" checked>
                    <label class="form-check-label" for="subActive">Active</label>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-success" type="submit" id="subSubmitBtn">
                <span class="spinner-border spinner-border-sm me-2 d-none" id="subSpinner"></span>
                <span id="subBtnText">Save</span>
              </button>
              <button type="button" class="btn btn-white" data-bs-dismiss="modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- VIEW -->
    <div tabindex="-1" id="subViewModal" class="modal fade">
      <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="subViewTitle"><i class="fa fa-list me-1 text-primary"></i> Sub-Account Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="subViewBody"></div>
          <div class="modal-footer"><button type="button" class="btn btn-white" data-bs-dismiss="modal">Close</button></div>
        </div>
      </div>
    </div>

  </div><!-- /panel -->

  <script th:inline="none">
  (function () {
    'use strict';

    var BASE    = '/accounts/sub-accounts';
    var COA_URL = '/accounts/chart-of-accounts/search';

    var dt          = null;   // DataTable instance for the current tab
    var _type       = '';     // active partition, '' = All
    var _meta       = null;   // schema for _type
    var _metaCache  = {};     // type -> schema
    var _types      = [];     // tab strip
    var _select2Ids = [];     // Select2 widgets alive in the modal right now

    /* ═══════════════════════════════════════════════════════════════════
       BOOT
       ═══════════════════════════════════════════════════════════════════ */

    document.addEventListener('DOMContentLoaded', function () {
      var cfg = document.getElementById('subPageConfig');
      _type = (cfg && cfg.getAttribute('data-type')) || '';

      document.getElementById('subForm').addEventListener('submit', _onSubmit);
      document.getElementById('subType').addEventListener('change', function () {
        _applyFormSchema(this.value, null);
      });

      _loadTypes().then(function () {
        return _switchType(_type);
      });
    });

    /* ═══════════════════════════════════════════════════════════════════
       SCHEMA
       ═══════════════════════════════════════════════════════════════════ */

    function _loadMeta(type) {
      var key = type || '';
      if (_metaCache[key]) return Promise.resolve(_metaCache[key]);
      return secureFetch(BASE + '/meta?type=' + encodeURIComponent(key)).then(function (m) {
        _metaCache[key] = m;
        return m;
      });
    }

    function _loadTypes() {
      return secureFetch(BASE + '/types').then(function (list) {
        _types = list || [];
        var html = '';
        _types.forEach(function (t) {
          html += '<li class="nav-item">'
                + '<a class="nav-link" href="javascript:;" data-type="' + t.type + '">'
                + '<i class="fas ' + t.icon + ' me-1"></i>' + _esc(t.label)
                + ' <span class="badge bg-secondary ms-1">' + (t.count || 0) + '</span>'
                + '</a></li>';
        });
        var tabs = document.getElementById('subTypeTabs');
        tabs.innerHTML = html;
        tabs.querySelectorAll('.nav-link').forEach(function (a) {
          a.addEventListener('click', function () { _switchType(a.dataset.type); });
        });

        // Type dropdown inside the modal — same source, so it can never drift
        // from the tabs the way two hard-coded lists eventually do.
        var sel = document.getElementById('subType');
        sel.innerHTML = '<option value="">— Select Type —</option>'
          + _types.filter(function (t) { return t.type; })
                  .map(function (t) { return '<option value="' + t.type + '">' + _esc(t.label) + '</option>'; })
                  .join('');
      });
    }

    /* ═══════════════════════════════════════════════════════════════════
       TAB SWITCH  →  rebuild grid from the new schema
       ═══════════════════════════════════════════════════════════════════ */

    function _switchType(type) {
      _type = type || '';
      document.querySelectorAll('#subTypeTabs .nav-link').forEach(function (a) {
        a.classList.toggle('active', a.dataset.type === _type);
      });
      return _loadMeta(_type).then(function (meta) {
        _meta = meta;
        document.getElementById('subPageSubtitle').textContent = meta.label;
        document.getElementById('subCreateLabel').textContent =
          meta.creatable ? ('New ' + _singular(meta.label)) : 'New Sub-Account';
        _buildTable(meta);
      });
    }

    function _singular(label) {
      return label.replace(/ies$/, 'y').replace(/s$/, '');
    }

    /* ═══════════════════════════════════════════════════════════════════
       GRID
       ═══════════════════════════════════════════════════════════════════ */

    function _buildTable(meta) {
      // Columns differ per partition, so the table is rebuilt rather than
      // reloaded. destroy() + emptying the header is what lets DataTables accept
      // a different column count on the same element.
      if (dt) { dt.destroy(); dt = null; }
      document.getElementById('subTable').querySelector('tbody').innerHTML = '';

      var head = '';
      meta.columns.forEach(function (c) {
        head += '<th class="text-' + (c.align || 'start') + '"'
              + (c.width ? ' width="' + c.width + '"' : '') + '>' + _esc(c.label) + '</th>';
      });
      document.getElementById('subTableHead').innerHTML = head;

      dt = $('#subTable').DataTable({
        // serverSide was false while the endpoint already applied OFFSET/LIMIT,
        // so the browser received page 1 and then paginated that. Anything past
        // row 25 was unreachable and the search box only searched what had
        // already arrived.
        processing : true,
        serverSide : true,
        responsive : true,
        pageLength : 25,
        lengthMenu : [[10, 25, 50, 100], [10, 25, 50, 100]],
        ajax: {
          url  : BASE + '/list',
          type : 'GET',
          data : function (d) {
            d.subAccountType = _type;
            try {
              if (d.order && d.order.length) {
                d.sortKey = d.columns[d.order[0].column].data;
                d.sortDir = d.order[0].dir;
              }
            } catch (e) { /* fall back to the server default */ }
            delete d.columns;
            delete d.order;
          },
          error: function (xhr) {
            if (xhr.status === 401) { window.location.href = '/login?expired'; return; }
            toast('Error', 'Could not load sub-accounts.', 'error');
          }
        },
        columns: meta.columns.map(function (c) {
          return {
            data          : c.key,
            defaultContent: '—',
            orderable     : !c.html && c.key !== 'sl',
            className     : 'text-' + (c.align || 'start')
          };
        }),
        order: [],
        language: {
          emptyTable : 'No sub-accounts yet.',
          processing : '<span class="spinner-border spinner-border-sm me-2"></span> Loading…'
        }
      });
    }

    /* ═══════════════════════════════════════════════════════════════════
       FORM BUILDER
       ═══════════════════════════════════════════════════════════════════ */

    function _applyFormSchema(type, dto) {
      var hint = document.getElementById('subTypeHint');
      if (!type) {
        document.getElementById('subFormBody').innerHTML =
          '<div class="text-muted small py-3">Choose a type to see its fields.</div>';
        hint.textContent = '';
        return Promise.resolve(null);
      }
      return _loadMeta(type).then(function (meta) {
        hint.innerHTML = '<i class="fas ' + meta.icon + ' me-1"></i>' + _esc(meta.label)
                       + (meta.mainAccountHint ? ' — ' + _esc(meta.mainAccountHint) : '');
        _renderFields(meta);
        if (dto) _fillForm(meta, dto);
        else _initPickers(meta, {});
        return meta;
      });
    }

    function _renderFields(meta) {
      _destroySelect2();
      var html = '';
      meta.groups.forEach(function (g) {
        html += '<h6 class="text-muted border-bottom pb-1 mt-3 mb-2">'
              + '<i class="fas ' + g.icon + ' me-1"></i> ' + _esc(g.title) + '</h6>'
              + '<div class="row g-2">';
        g.fields.forEach(function (f) { html += _renderField(f); });
        html += '</div>';
      });
      document.getElementById('subFormBody').innerHTML = html;
    }

    function _renderField(f) {
      var id    = 'sf_' + f.key;
      var col   = 'col-md-' + (f.width || 4);
      var req   = f.required ? ' required' : '';
      var star  = f.required ? ' <span class="text-danger">*</span>' : '';
      var maxlen = f.maxLength ? ' maxlength="' + f.maxLength + '"' : '';
      var label = '<label for="' + id + '" class="input-label">' + _esc(f.label) + star + '</label>';

      switch (f.input) {
        case 'SWITCH':
          return '<div class="' + col + '"><div class="form-check form-switch mt-2">'
               + '<input class="form-check-input" type="checkbox" id="' + id + '">'
               + '<label class="form-check-label" for="' + id + '">' + _esc(f.label) + '</label>'
               + '</div></div>';

        case 'TEXTAREA':
          return '<div class="' + col + ' view-group">'
               + '<textarea id="' + id + '" class="form-control hs_span_view" rows="2"' + maxlen + req + '></textarea>'
               + label + '</div>';

        case 'SELECT':
          var opts = '<option value="">— Select —</option>'
                   + (f.options || '').split(',').filter(Boolean).map(function (o) {
                       return '<option value="' + o + '">' + o.replace(/_/g, ' ') + '</option>';
                     }).join('');
          return '<div class="' + col + ' view-group">'
               + '<select id="' + id + '" class="form-select hs_span_view"' + req + '>' + opts + '</select>'
               + label + '</div>';

        case 'AJAX_COA':
        case 'AJAX_BANK':
        case 'AJAX_SUB':
          return '<div class="' + col + ' view-group">'
               + '<select id="' + id + '" class="form-select hs_span_view" data-ajax="' + f.input + '"'
               + ' data-filter="' + (f.options || '') + '"' + req + '></select>'
               + label + '</div>';

        case 'DATE':
          return '<div class="' + col + ' view-group">'
               + '<input id="' + id + '" type="date" class="form-control hs_span_view"' + req + '>'
               + label + '</div>';

        case 'NUMBER':
          return '<div class="' + col + ' view-group">'
               + '<input id="' + id + '" type="number" step="1" class="form-control hs_span_view text-end"' + req + '>'
               + label + '</div>';

        case 'AMOUNT':
          return '<div class="' + col + ' view-group">'
               + '<input id="' + id + '" type="number" step="0.01" class="form-control hs_span_view text-end" placeholder="0.00"' + req + '>'
               + label + '</div>';

        case 'RATE':
          return '<div class="' + col + ' view-group">'
               + '<input id="' + id + '" type="number" step="0.0001" class="form-control hs_span_view text-end" placeholder="0.0000"' + req + '>'
               + label + '</div>';

        case 'EMAIL':
          return '<div class="' + col + ' view-group">'
               + '<input id="' + id + '" type="email" class="form-control hs_span_view"' + maxlen + req + '>'
               + label + '</div>';

        case 'TEXT_UPPER':
          return '<div class="' + col + ' view-group">'
               + '<input id="' + id + '" type="text" class="form-control hs_span_view text-uppercase"' + maxlen + req + '>'
               + label + '</div>';

        default: // TEXT
          return '<div class="' + col + ' view-group">'
               + '<input id="' + id + '" type="text" class="form-control hs_span_view"' + maxlen + req + '>'
               + label + '</div>';
      }
    }

    /* ═══════════════════════════════════════════════════════════════════
       SELECT2
       ═══════════════════════════════════════════════════════════════════ */

    function _initPickers(meta, dto) {
      meta.groups.forEach(function (g) {
        g.fields.forEach(function (f) {
          if (f.input !== 'AJAX_COA' && f.input !== 'AJAX_BANK' && f.input !== 'AJAX_SUB') return;

          var id  = 'sf_' + f.key;
          var url = f.input === 'AJAX_COA'  ? COA_URL
                  : f.input === 'AJAX_BANK' ? BASE + '/banks'
                  : BASE + '/search';

          var preId   = dto ? dto[f.key] : null;
          var preText = dto ? _preText(f.key, dto) : null;
          _initSelect2(id, url, f.options, preId, preText);
        });
      });
    }

    // Each picker's id field has a matching display field on the DTO, so an edit
    // can show the current selection without a second round-trip per dropdown.
    function _preText(key, dto) {
      switch (key) {
        case 'mainAccountId':       return dto.mainAccountDisplay;
        case 'bankId':              return dto.bankName;
        case 'cardAcquirerBankId':  return dto.cardAcquirerBankName;
        case 'settlementAccountId': return dto.settlementAccountDisplay;
        default:                    return null;
      }
    }

    function _initSelect2(id, url, filter, preId, preText) {
      var $el = $('#' + id);
      if (!$el.length) return;
      if ($el.hasClass('select2-hidden-accessible')) $el.select2('destroy');

      $el.select2({
        dropdownParent    : $('#subModal'),
        width             : '100%',
        placeholder       : '— Search —',
        allowClear        : true,
        minimumInputLength: 0,
        ajax: {
          url      : url,
          dataType : 'json',
          delay    : 250,
          data     : function (params) {
            var q = { search: params.term || '', page: params.page || 1 };
            if (filter) q.subAccountType = filter;
            return q;
          },
          processResults: function (data, params) {
            params.page = params.page || 1;
            return {
              results   : (data.items || []).map(function (i) {
                            return { id: i.id, text: i.text, badge: i.accountType || i.subAccountType || '' };
                          }),
              pagination: { more: data.hasMore || false }
            };
          },
          cache: true
        },
        templateResult: function (r) {
          if (r.loading) return r.text;
          return $('<div><strong>' + _esc(r.text) + '</strong>'
                 + (r.badge ? ' <span class="badge bg-secondary ms-1">' + _esc(r.badge) + '</span>' : '')
                 + '</div>');
        },
        templateSelection: function (r) { return r.text || r.id; }
      });

      if (preId) $el.append(new Option(preText || String(preId), preId, true, true)).trigger('change');
      _select2Ids.push(id);
    }

    function _destroySelect2() {
      _select2Ids.forEach(function (id) {
        var $el = $('#' + id);
        if ($el.length && $el.hasClass('select2-hidden-accessible')) $el.select2('destroy');
      });
      _select2Ids = [];
    }

    /* ═══════════════════════════════════════════════════════════════════
       READ / WRITE THE FORM
       ═══════════════════════════════════════════════════════════════════ */

    function _fillForm(meta, dto) {
      meta.groups.forEach(function (g) {
        g.fields.forEach(function (f) {
          var el = document.getElementById('sf_' + f.key);
          if (!el) return;
          var v = dto[f.key];
          if (f.input === 'SWITCH')      el.checked = v === true;
          else if (!_isAjax(f.input))    el.value   = (v === null || v === undefined) ? '' : v;
        });
      });
      _initPickers(meta, dto);
    }

    function _collect(meta) {
      var payload = {
        id             : document.getElementById('subId').value || null,
        subAccountType : document.getElementById('subType').value,
        active         : document.getElementById('subActive').checked
      };
      meta.groups.forEach(function (g) {
        g.fields.forEach(function (f) {
          var key = f.key;
          if (_isAjax(f.input)) {
            var raw = $('#sf_' + key).val();
            payload[key] = raw ? parseInt(raw, 10) : null;
            return;
          }
          var el = document.getElementById('sf_' + key);
          if (!el) return;

          if (f.input === 'SWITCH') { payload[key] = el.checked; return; }

          var v = el.value;
          if (v === '' || v === null || v === undefined) { payload[key] = null; return; }

          if (f.input === 'AMOUNT' || f.input === 'RATE') {
            // Number('0') is 0, which is falsy — parseFloat(v) || null would turn a
            // deliberate zero limit into null. isNaN is the correct guard here.
            var n = parseFloat(v);
            payload[key] = isNaN(n) ? null : n;
          } else if (f.input === 'NUMBER') {
            var i = parseInt(v, 10);
            payload[key] = isNaN(i) ? null : i;
          } else {
            payload[key] = v;
          }
        });
      });
      return payload;
    }

    function _isAjax(input) {
      return input === 'AJAX_COA' || input === 'AJAX_BANK' || input === 'AJAX_SUB';
    }

    /* ═══════════════════════════════════════════════════════════════════
       ACTIONS
       ═══════════════════════════════════════════════════════════════════ */

    window.subOpenCreate = function () {
      _resetForm();
      var sel = document.getElementById('subType');
      sel.disabled = false;
      document.getElementById('subTypeLockNote').textContent = '';
      sel.value = _type || '';

      _applyFormSchema(sel.value, null).then(function () {
        document.getElementById('subModalTitle').innerHTML =
          '<i class="fa fa-plus me-1 text-success"></i> New Sub-Account';
        document.getElementById('subBtnText').textContent = 'Save';
        bootstrap.Modal.getOrCreateInstance(document.getElementById('subModal')).show();
      });
    };

    window.subEdit = function (id) {
      secureFetch(BASE + '/show/' + id).then(function (res) {
        if (!res.success) { Swal.fire('Error', res.message, 'error'); return; }
        var o = res.obj.defaultData;

        _resetForm();
        document.getElementById('subId').value    = o.id;
        document.getElementById('subActive').checked = o.active !== false;

        var sel = document.getElementById('subType');
        sel.value = o.subAccountType || '';
        // Single-table inheritance stores the type in the discriminator, which
        // JPA will not rewrite on an existing row — the server rejects a change,
        // so the control is locked rather than left to fail on save.
        sel.disabled = true;
        document.getElementById('subTypeLockNote').textContent = 'Type cannot be changed after creation.';

        _applyFormSchema(o.subAccountType, o).then(function () {
          document.getElementById('subModalTitle').innerHTML =
            '<i class="fa fa-pencil me-1 text-warning"></i> Edit ' + _esc(o.subAccountTypeLabel || 'Sub-Account');
          document.getElementById('subBtnText').textContent = 'Update';
          bootstrap.Modal.getOrCreateInstance(document.getElementById('subModal')).show();
        });
      });
    };

    window.subShow = function (id) {
      secureFetch(BASE + '/show/' + id).then(function (res) {
        if (!res.success) { Swal.fire('Error', res.message, 'error'); return; }
        var o = res.obj.defaultData;

        _loadMeta(o.subAccountType).then(function (meta) {
          var html = '<div class="hs-box">'
                   + '<div class="row g-2">'
                   + _vf('Type', o.subAccountTypeLabel)
                   + _vf('Code', o.subAccountCode)
                   + _vf('Status', o.active ? 'Active' : 'Inactive')
                   + '</div>';

          meta.groups.forEach(function (g) {
            var body = '';
            g.fields.forEach(function (f) {
              var v = o[f.key];
              if (f.input === 'SWITCH')      v = v === true ? 'Yes' : 'No';
              else if (f.key === 'mainAccountId')       v = o.mainAccountDisplay;
              else if (f.key === 'bankId')              v = o.bankName;
              else if (f.key === 'cardAcquirerBankId')  v = o.cardAcquirerBankName;
              else if (f.key === 'settlementAccountId') v = o.settlementAccountDisplay;
              body += _vf(f.label, v);
            });
            html += '<h6 class="text-muted border-bottom pb-1 mt-3 mb-2">'
                  + '<i class="fas ' + g.icon + ' me-1"></i> ' + _esc(g.title) + '</h6>'
                  + '<div class="row g-2">' + body + '</div>';
          });

          html += '<h6 class="text-muted border-bottom pb-1 mt-3 mb-2"><i class="fas fa-clock-rotate-left me-1"></i> Audit</h6>'
                + '<div class="row g-2">'
                + _vf('Created By', o.createdBy) + _vf('Created At', o.createdAt)
                + _vf('Updated By', o.updatedBy) + _vf('Updated At', o.updatedAt)
                + '</div></div>';

          document.getElementById('subViewTitle').innerHTML =
            '<i class="fas ' + meta.icon + ' me-1 text-primary"></i> ' + _esc(o.subAccountName || 'Sub-Account');
          document.getElementById('subViewBody').innerHTML = html;
          bootstrap.Modal.getOrCreateInstance(document.getElementById('subViewModal')).show();
        });
      });
    };

    window.subToggle = function (id) { hsChangeStatus(BASE + '/toggle/' + id, dt, 'Sub-Account'); };
    window.subDelete = function (id) { hsConfirmDelete(BASE + '/delete/' + id, dt); };

    /* ═══════════════════════════════════════════════════════════════════
       SUBMIT
       ═══════════════════════════════════════════════════════════════════ */

    function _onSubmit(e) {
      e.preventDefault();

      var type = document.getElementById('subType').value;
      if (!type) { Swal.fire('Type required', 'Choose a sub-account type first.', 'warning'); return; }
      if (!_metaCache[type]) return;

      var sb = document.getElementById('subSubmitBtn'),
          sp = document.getElementById('subSpinner'),
          bt = document.getElementById('subBtnText'),
          fm = document.getElementById('subForm');

      var payload = _collect(_metaCache[type]);
      if (!payload.mainAccountId) {
        Swal.fire('Main account required', 'Select the GL head this sub-ledger posts to.', 'warning');
        return;
      }
      if (!payload.subAccountName) {
        Swal.fire('Name required', 'Enter a sub-account name.', 'warning');
        return;
      }

      hsDisableButton(sb, sp, bt);
      secureFetch(BASE + '/save', { method: 'POST', body: JSON.stringify(payload) })
        .then(function (d) {
          // Argument order is (message, success, form, table) — matches the
          // definition in application.js. The previous page passed (success,
          // message, …), so every save toast showed "true" as its text and every
          // failure was reported as a success.
          hsAfterSaveMessages(d.message, d.success, d.success ? fm : null, dt);
          if (d.success) {
            bootstrap.Modal.getOrCreateInstance(document.getElementById('subModal')).hide();
            _refreshCounts();
          }
        })
        .catch(function (err) { Swal.fire('Error', err.message || 'Request failed.', 'error'); })
        .finally(function () { hsEnableButton(sb, sp, bt); });
    }

    /* ═══════════════════════════════════════════════════════════════════
       HELPERS
       ═══════════════════════════════════════════════════════════════════ */

    function _resetForm() {
      _destroySelect2();
      document.getElementById('subForm').reset();
      document.getElementById('subId').value = '';
      document.getElementById('subActive').checked = true;
      document.getElementById('subFormBody').innerHTML = '';
    }

    function _refreshCounts() {
      secureFetch(BASE + '/types').then(function (list) {
        (list || []).forEach(function (t) {
          var a = document.querySelector('#subTypeTabs .nav-link[data-type="' + t.type + '"]');
          if (a) {
            var badge = a.querySelector('.badge');
            if (badge) badge.textContent = t.count || 0;
          }
        });
      });
    }

    function _vf(label, value) {
      var shown = (value === null || value === undefined || value === '') ? '—' : value;
      return '<div class="col-md-4 view-group">'
           + '<label class="view-label">' + _esc(label) + '</label>'
           + '<span class="form-control hs_span_show">' + _esc(shown) + '</span></div>';
    }

    // Values reach the DOM as strings here, so anything a user typed into a name
    // or remarks field is escaped before it is concatenated into markup.
    function _esc(v) {
      if (v === null || v === undefined) return '';
      return String(v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  })();
  </script>
</section>
