spring.application.name=spindle

# ============================================================================
# DATABASE (PostgreSQL + Hikari)
# ============================================================================
#
# ★ The password default below (asg2020) is a credential sitting in a
#   Git-tracked file. The ${DB_PASSWORD:...} placeholder means it is ONLY a
#   fallback — but a fallback that works is a fallback that gets used, and then
#   nobody ever sets the env var. Set DB_PASSWORD in every real environment and
#   consider deleting the default entirely so a misconfigured deploy fails loudly
#   instead of silently connecting with the committed password.
#
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spindle}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:asg2020}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=SpindleserpHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# ============================================================================
# JPA / HIBERNATE
# ============================================================================
#
# ddl-auto stays at "update" ON PURPOSE.
#
#   There is NO Flyway dependency in pom.xml. Whatever the module READMEs say
#   about V1__/V100__ migrations, the artifact that actually builds does not
#   contain flyway-core, so nothing runs them. Hibernate's schema update IS the
#   schema manager for this application, today, in production.
#
#   Setting this to "validate" (the usual hardening advice) would therefore stop
#   the app from starting the moment any entity is ahead of the database. Do not
#   change it until Flyway is actually on the classpath and the baseline is
#   established. Flagging it rather than "fixing" it into an outage.
#
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# ============================================================================
# SPRING SESSION (JDBC-backed — sessions live in PostgreSQL)
# ============================================================================
#
# ── A CORRECTION TO THE PREVIOUS COMMENT IN THIS FILE ─────────────────────
#
#   The old comment block said, in several places, that
#   initialize-schema=always "drops and recreates SPRING_SESSION and
#   SPRING_SESSION_ATTRIBUTES on every application startup" and that this was
#   "the actual live cause of the need to submit the login twice".
#
#   That is not what it does. Spring Session's PostgreSQL schema script
#   (spring-session-jdbc: org/springframework/session/jdbc/schema-postgresql.sql)
#   contains only CREATE TABLE and CREATE INDEX — there is no DROP anywhere in
#   it — and Boot runs it with continueOnError(true)
#   (JdbcSessionDataSourceScriptDatabaseInitializer.getSettings()). On an
#   existing schema every statement fails with "relation already exists" and is
#   swallowed. No session is ever deleted by it.
#
#   So "always" was NOT wiping sessions, and it was not the double-login bug.
#   The double-login bug was the two things that WERE correctly identified and
#   fixed: the eager-CSRF-token race (→ XorCsrfTokenRequestAttributeHandler) and
#   logout deleting a cookie named "JSESSIONID" that does not exist in this app
#   (→ deleteCookies("SESSION")).
#
#   Worth being precise about, because the wrong explanation is now written into
#   two source files as fact, and someone will eventually act on it.
#
# ── What is nevertheless worth changing, and why ──────────────────────────
#
#   "always" means the app runs DDL against the database on every single boot.
#   That requires the application's DB user to hold CREATE TABLE privileges at
#   runtime — which, in a hardened deployment, it should not. It also logs a
#   fistful of "relation already exists" errors on every restart, which is
#   exactly the kind of routine noise that trains people to ignore the startup
#   log.
#
#   Recommended path to production:
#     1. Boot once against the target DB with a privileged user (tables created).
#     2. Set SESSION_SCHEMA_INIT=never.
#     3. Revoke DDL rights from the application's DB user.
#
#   It is left as "always" by default here rather than switched to "never",
#   because with no Flyway on the classpath NOTHING ELSE creates these tables —
#   flipping the default would break a fresh deployment on an empty database.
#
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=${SESSION_SCHEMA_INIT:always}
spring.session.jdbc.table-name=SPRING_SESSION

# ── ONE timeout, defined here only. ───────────────────────────────────────
#   server.servlet.session.timeout (container) and spring.session.timeout
#   (Spring Session JDBC) are two separate mechanisms. With store-type=jdbc the
#   container's session is replaced entirely. Setting both lets them disagree,
#   which surfaces as "session expired" while the JDBC row is still alive.
#   Only spring.session.timeout is set.
spring.session.timeout=30m

# ============================================================================
# SESSION COOKIE  ★ NONE of these flags were set before
# ============================================================================
#
# name — RETAINED and load-bearing. With store-type=jdbc, Spring Session issues
#   a cookie called SESSION, not the container's JSESSIONID. SecurityConfig's
#   logout previously called deleteCookies("JSESSIONID") — a cookie that does
#   not exist in this app — so logout never cleared the browser's real session
#   cookie. Pinning the name here keeps config and code from drifting apart.
server.servlet.session.cookie.name=SESSION

# http-only — the session cookie must be unreadable from JavaScript. Any XSS
#   anywhere on the domain would otherwise hand the attacker a live session.
#   (DefaultCookieSerializer already defaults to true; stated explicitly so it
#   cannot be lost to a future default change or an accidental override.)
server.servlet.session.cookie.http-only=true

# same-site — Lax blocks the cookie on cross-site POSTs, which is a second,
#   independent layer under CSRF tokens. Not "instead of" — under.
server.servlet.session.cookie.same-site=lax

# secure — DELIBERATELY LEFT UNSET.
#   Unset, DefaultCookieSerializer follows request.isSecure(): the Secure flag is
#   sent over HTTPS and omitted over plain HTTP. That is exactly the behaviour we
#   want, and it is correct in dev AND in prod with no per-environment change.
#
#   Setting it to false FORCES it off even on HTTPS — strictly worse than leaving
#   it out. Only set it (to true) if you terminate TLS at a proxy that forwards
#   over plain HTTP and the app therefore cannot see that the original request
#   was secure:
# server.servlet.session.cookie.secure=true

# ============================================================================
# APPLICATION SECURITY  (→ SpindleSecurityProperties)
# ============================================================================

# ── remember-me ───────────────────────────────────────────────────────────
#
# ★ The key WAS HARD-CODED IN SecurityConfig.java as "spindleErpRememberMeKey2026".
#
#   TokenBasedRememberMeServices signs its cookie as
#       md5( username : expiry : password-hash : KEY )
#   The key is the ONLY secret in that construction. Anyone who holds it — i.e.
#   anyone who has ever cloned this repository, every CI runner that ever built
#   it, anyone who ever gets read access to the source — can forge a valid
#   remember-me cookie for any account whose password hash they can also obtain.
#   It is a credential, and it now lives in the environment.
#
#   Generate one:  openssl rand -base64 48
#   The app logs a loud WARN at startup while the old default is still in use.
#
app.security.remember-me.enabled=${REMEMBER_ME_ENABLED:true}
app.security.remember-me.key=${APP_REMEMBER_ME_KEY:spindleErpRememberMeKey2026}
app.security.remember-me.validity-seconds=604800
app.security.remember-me.cookie-name=SPINDLE_RM

# ── ERP staff login throttle (/login) ─────────────────────────────────────
#
# ★ There was NO brute-force protection anywhere. sec_users.account_non_locked
#   existed as a column and was checked at login, and NOTHING in the codebase
#   ever set it to false — so the lock existed on paper and had never once fired.
#
#   max-attempts        → per identifier
#   max-attempts-per-ip → per source IP; catches password SPRAYING (one common
#                         password against many accounts), which the
#                         per-identifier counter cannot see because each
#                         individual account only ever records 1-2 failures.
#
app.security.login.max-attempts=5
app.security.login.max-attempts-per-ip=20
app.security.login.window-minutes=15
app.security.login.lock-minutes=15
#
# generic-errors=false → the user is told "your account is disabled / locked"
#   rather than "wrong password". Good UX for an internal ERP; it does confirm
#   to an attacker that the username exists. Set true if /login is ever exposed
#   to the open internet.
app.security.login.generic-errors=false

# ── Storefront customer login (/account/login) ────────────────────────────
app.security.storefront.max-login-attempts=8
app.security.storefront.max-login-attempts-per-ip=30
app.security.storefront.window-minutes=15
app.security.storefront.lock-minutes=15
app.security.storefront.max-registrations-per-ip-per-hour=5
#
# ★ Registration previously accepted 6-character passwords with no composition
#   rule at all. "123456" was a valid customer password.
app.security.storefront.min-password-length=8
app.security.storefront.require-letter-and-digit=true
#
# 0 = disabled. Set (e.g. 60) to force re-login after inactivity — worth doing if
# customers shop from shared machines.
app.security.storefront.idle-timeout-minutes=0

# ── Reverse proxy ─────────────────────────────────────────────────────────
#
# ★ X-Forwarded-For was previously trusted UNCONDITIONALLY (StorefrontAuthService
#   .recordLogin). It is a plain request header — any client can send any value.
#   Trusting it means the login audit trail records attacker-chosen IPs, and any
#   IP-based rate limit is bypassed by simply rotating the header.
#
#   Set true ONLY when a reverse proxy (nginx / ALB / Cloudflare) OVERWRITES the
#   header on every inbound request. If the app is directly internet-facing,
#   leave it false.
app.security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}

# ── HTTPS ─────────────────────────────────────────────────────────────────
# require-https   → emit HSTS + mark the remember-me cookie Secure.
# redirect-to-https → have the APP redirect http→https. Leave false when the
#                     proxy already does it, or you get a redirect loop.
app.security.require-https=${REQUIRE_HTTPS:false}
app.security.redirect-to-https=false

# ── Concurrent sessions per ERP user ──────────────────────────────────────
# Was hard-coded to 3 in SecurityConfig. Must stay > 1: during login there are
# briefly TWO live sessions for one principal (the anonymous pre-auth session and
# the new authenticated one), and a limit of 1 expires the new one.
app.security.max-sessions-per-user=3

# ── Response headers ──────────────────────────────────────────────────────
#
# ★ The app previously sent NO Content-Security-Policy and NO Permissions-Policy.
#
#   script-src is DELIBERATELY ABSENT from this policy. The Color Admin theme is
#   wall-to-wall inline <script> and inline style="…"; a script-src directive
#   would white-screen the entire admin. What is here costs nothing and closes
#   three whole attack classes anyway:
#       frame-ancestors 'self'  → clickjacking (the only control modern browsers
#                                 still honour; X-Frame-Options is legacy)
#       base-uri 'self'         → <base href> injection, which silently re-points
#                                 every relative script/form URL on the page at
#                                 an attacker's host
#       form-action 'self'      → an injected form cannot POST the CSRF token or
#                                 the user's input off-site
#       object-src 'none'       → legacy plugin XSS
#
#   Tighten to a nonce-based script-src once the theme's inline JS is
#   externalised. That is then a config change here, not a code change.
#
app.security.content-security-policy=object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'
#app.security.content-security-policy=default-src 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'
app.security.permissions-policy=geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=()

# ============================================================================
# STOREFRONT / TRAVEL-SITE — anonymous-visitor organisation context
# ============================================================================
#
# ContextProvider.getOrganizationId() is populated only by
# UserContextService.loadContext() at ERP staff login. An anonymous shopper never
# goes through /login, so without this every ContextProvider.getOrganizationId()
# call made on their behalf runs with orgId = NULL — empty results at best, and a
# hard SQL syntax error at worst, because StorefrontProductService.browse()
# interpolates the value straight into the query text ("WHERE p.organization_id = "
# + orgId → the literal "= null").
#
# StorefrontOrgContextFilter seeds this org for anonymous storefront and
# travel-site requests. It NEVER overwrites a logged-in ERP staff member's real
# org context.
#
#   Find the id:  SELECT id, code, name FROM org_organizations ORDER BY id;
#
app.storefront.default-organization-id=1

# ============================================================================
# THYMELEAF
# ============================================================================
# cache=false is a DEV setting — it re-parses every template on every render.
# Set THYMELEAF_CACHE=true in production.
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ============================================================================
# FILE UPLOADS
# ============================================================================
# Production (Linux)
#app.upload-dir=/var/www/spindleserp/file/uploads
#file.upload.product-images=/var/www/spindleserp/product/images

# Production (Windows)
app.upload-dir=D:/spindleserps/file/uploads
file.upload.product-images=D:/spindleserp/product/images

# ★ There were NO multipart limits, so Spring Boot's defaults applied (1MB file /
#   10MB request). Stating them explicitly means the limit is a decision rather
#   than an accident, and it is the cheapest possible upload-DoS control.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ============================================================================
# OCR (Passport Scanning)
# ============================================================================
# Path to Tesseract OCR tessdata directory.
#   Windows (default): C:/Program Files/Tesseract-OCR/tessdata
#   Linux:             /usr/share/tesseract-ocr/4.00/tessdata
#   Override via env:  APP_OCR_TESSERACT_DATA_PATH
# Install Tesseract from: https://github.com/UB-Mannheim/tesseract/wiki
#app.ocr.tesseract-data-path=${APP_OCR_TESSERACT_DATA_PATH:}

# ============================================================================
# ERROR RESPONSES
# ============================================================================
# Never leak a stack trace, an exception class or a binding error to a client.
# (These are already Boot's defaults; pinned so an override cannot quietly turn
#  the app into a stack-trace oracle.)
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never

# ============================================================================
# ACTUATOR
# ============================================================================
# Only /actuator/health is permitAll in SecurityConfig; everything else under
# /actuator/** falls through to DynamicAuthorizationManager and is denied. Pinned
# here so that exposing a new endpoint has to be a conscious act.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ============================================================================
# LOGGING
# ============================================================================
#
# ★ REMOVED:  logging.level.org.springframework.security.web.csrf=TRACE
#
#   CsrfFilter at TRACE LOGS THE CSRF TOKEN VALUE on every request. That turns
#   the application log — a file that is routinely tailed over SSH, shipped to a
#   central log server, and read by people who have no business holding session
#   credentials — into a live feed of valid CSRF tokens. Combined with a leaked
#   session cookie it is a complete CSRF bypass, and it is a data-at-rest problem
#   even without one.
#
#   It was clearly added to debug the first-submit CSRF failure. That bug is
#   fixed (XorCsrfTokenRequestAttributeHandler). The debug switch has no business
#   surviving into production.
#
logging.level.root=WARN
logging.level.com.asg.spindleserp=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# Turn these back on ONLY while actively debugging an auth problem, and turn them
# off again afterwards. csrf=TRACE prints token values; access=DEBUG prints every
# authorization decision.
#logging.level.org.springframework.security.web.csrf=TRACE
#logging.level.org.springframework.security.web.access=DEBUG
